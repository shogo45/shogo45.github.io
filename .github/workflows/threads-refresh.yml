name: threads-refresh

on:
  schedule:
    - cron: "17 1 * * 1"   # 毎週月曜 10:17 JST。Threadsのトークン（60日）を延長する
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh Threads token
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python bot/threads_refresh.py
