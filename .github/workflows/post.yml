name: post

on:
  schedule:
    # 枠は 07:40 / 12:10 / 18:30 / 21:00 / 22:30（queue の time）。GitHubの定時実行は1〜2時間遅れることがあるので、
    # 7〜23時のあいだ30分おきに起動し、時刻が来た未投稿の枠を出す（post_bsky.py が判定。出す枠がなければ何もしない）
    - cron: "7,37 22,23,0-14 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "この時間（時間）のあいだ5分おきに見て、時刻が来た投稿を出し続ける（0なら1回だけ）"
        default: "0"

permissions:
  contents: write

concurrency:
  group: post   # 投稿は1つずつ（二重投稿は claim.py の先取りでも防ぐ）
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Load Threads token
        env:
          THREADS_KEY: ${{ secrets.THREADS_KEY }}
          THREADS_TOKEN_SECRET: ${{ secrets.THREADS_TOKEN }}
        run: bash bot/threads_token.sh

      - name: Post (Bluesky / Threads)
        env:
          TZ: Asia/Tokyo
          OUT_DIR: bot/out
          HOURS: ${{ github.event.inputs.hours || '0' }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: bash bot/post_loop.sh
